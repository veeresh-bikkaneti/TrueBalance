services:
  database:
    image: postgres:15-alpine
    container_name: pb-database
    environment:
      POSTGRES_USER: bookkeeping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example, or run scripts/init-env.sh)}
      POSTGRES_DB: OfflineCPADb
    volumes:
      - pb-pgdata:/var/lib/postgresql/data
    networks:
      - pb-network
    restart: unless-stopped

  backend:
    build:
      context: ./src
      dockerfile: Backend/Dockerfile
    container_name: pb-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING:?Set CONNECTION_STRING in .env (see .env.example, or run scripts/init-env.sh)}
      - Uploads__Directory=/app/user-assets
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/input:/app/data/input
      - pb-userassets:/app/user-assets
    depends_on:
      - database
    networks:
      - pb-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pb-frontend
    environment:
      - VITE_API_URL=http://localhost:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - pb-network

networks:
  pb-network:
    driver: bridge

volumes:
  pb-pgdata:
  pb-userassets:
