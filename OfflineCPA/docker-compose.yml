services:
  database:
    image: postgres:15-alpine
    container_name: pb-database
    environment:
      POSTGRES_USER: bookkeeping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: OfflineCPADb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookkeeping -d OfflineCPADb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pb-pgdata:/var/lib/postgresql/data
    networks:
      - pb-network
    restart: unless-stopped

  backend:
    build:
      context: ./src
      dockerfile: Backend/Dockerfile
    container_name: pb-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=OfflineCPADb;Username=bookkeeping;Password=${POSTGRES_PASSWORD:?required}
      - Uploads__Directory=/app/user-assets
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/input:/app/data/input
      - pb-userassets:/app/user-assets
    depends_on:
      database:
        condition: service_healthy
    networks:
      - pb-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pb-frontend
    environment:
      - VITE_API_URL=http://localhost:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - pb-network

networks:
  pb-network:
    driver: bridge

volumes:
  pb-pgdata:
  pb-userassets:
