name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet build OfflineCPA/OfflineCPA.sln --configuration Release
      - name: Tax map schema check
        run: dotnet test OfflineCPA/tests/TrueBalance.Tests --configuration Release --no-build --filter Category=TaxMapSchema
      - run: dotnet test OfflineCPA/OfflineCPA.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OfflineCPA/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - run: npm run lint
      - run: npm run build

  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 .agent/scripts/wiki_lint.py

