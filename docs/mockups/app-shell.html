<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrueBalance App Shell</title>
<style>
/* Same ledger-book look as setup-wizard.html: nav on the left, working pane on the right. No web fonts, no network. */
:root{--bg:#f5f7f6;--surface:#ffffff;--ink:#17201d;--muted:#5b6a64;--line:#d9e1dd;--accent:#1f6f5c;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#111715;--surface:#18201d;--ink:#e4ece8;--muted:#9aaba4;--line:#2b3632;--accent:#5cc3a4;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:16px}
h1{font-size:1.4rem;margin:0;font-weight:600}
h2{margin:0;font-size:1.15rem;font-weight:600}
p,ul{margin:0}
.note{font-size:.8rem;color:var(--muted)}
.app{display:grid;grid-template-columns:220px 1fr;gap:16px}
@media (max-width:720px){.app{grid-template-columns:1fr}}
nav ul{list-style:none;padding:0;display:grid;gap:4px}
nav a{display:block;border:1px solid transparent;border-radius:8px;padding:10px 12px;color:var(--muted);text-decoration:none}
nav a[aria-current="page"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:500}
a{color:var(--accent)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;min-width:0;display:grid;gap:16px;align-content:start}
section{display:none;gap:16px}
#home{display:grid}
#nowhere:target{display:grid}
#nowhere:target~#home{display:none}
</style>

<div class="wrap">
  <header>
    <h1>TrueBalance</h1>
    <div class="note">Mockup for review. <a href="#home">Home page</a> | <a href="#nowhere">Not-found page</a></div>
  </header>
  <div class="app">
    <nav aria-label="Screens"><ul>
      <li><a href="#home" aria-current="page">Home</a></li>
    </ul></nav>
    <main>
      <section id="nowhere">
        <h2>Page not found</h2>
        <p>There is no screen at this address.</p>
        <p><a href="#home">Go to Home</a></p>
      </section>
      <section id="home">
        <h2>TrueBalance</h2>
        <p>Your screens:</p>
        <ul><li><a href="#home">Home</a></li></ul>
      </section>
    </main>
  </div>
</div>
</html>
