<title>TrueBalance Setup Wizard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: ledger-book app shell; left step rail, right working pane, status bar showing offline + PII state */
:root{
  --bg:#f5f7f6; --surface:#ffffff; --ink:#17201d; --muted:#5b6a64; --line:#d9e1dd;
  --accent:#1f6f5c; --accent-soft:#e1f0eb; --warn:#9a5b00; --warn-soft:#fbefdc; --bad:#a3302a;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#18201d; --ink:#e4ece8; --muted:#9aaba4; --line:#2b3632;
  --accent:#5cc3a4; --accent-soft:#1d3a31; --warn:#e3a54a; --warn-soft:#3a2c14; --bad:#ef7d74; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#18201d; --ink:#e4ece8; --muted:#9aaba4; --line:#2b3632;
  --accent:#5cc3a4; --accent-soft:#1d3a31; --warn:#e3a54a; --warn-soft:#3a2c14; --bad:#ef7d74; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:1.4rem;margin:0;font-weight:600;text-wrap:balance}
.note{font-size:.8rem;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:.78rem;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.app{display:grid;grid-template-columns:220px 1fr;gap:16px}
@media (max-width:720px){.app{grid-template-columns:1fr}}
nav ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
nav button{width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:10px 12px;font:inherit;color:var(--muted);cursor:pointer;display:flex;gap:10px;align-items:center}
nav button .n{font-family:var(--mono);font-size:.8rem;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line)}
nav button[aria-current="step"]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:500}
nav button[aria-current="step"] .n{background:var(--accent);color:var(--surface);border-color:var(--accent)}
nav button:focus-visible,.opt:focus-within,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;min-width:0;display:grid;gap:16px;align-content:start}
h2{margin:0;font-size:1.15rem;font-weight:600}
p{margin:0;max-width:65ch}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:4px;cursor:pointer}
.opt input{margin:0 0 6px}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt b{font-weight:600}
.opt span{font-size:.85rem;color:var(--muted)}
label.f{display:grid;gap:4px;font-size:.88rem;font-weight:500}
input[type=text],input[type=password],select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:560px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.mask{font-family:var(--mono);background:var(--warn-soft);color:var(--warn);padding:1px 6px;border-radius:4px}
.flag{color:var(--warn);font-size:.8rem}
.ok{color:var(--accent);font-weight:500}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.btn{font:inherit;font-weight:500;padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.reports{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.rep{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:2px}
.rep b{font-weight:600}.rep span{font-size:.82rem;color:var(--muted)}
.status{font-family:var(--mono);font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:16px;border-top:1px solid var(--line);padding-top:10px}
@media (prefers-reduced-motion:no-preference){main section{animation:in .18s ease-out}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>TrueBalance setup</h1>
      <div class="note">Mockup for review. All rows below are example data, not real records.</div>
    </div>
    <div class="chips"><span class="chip">Offline: 0 network connections</span><span class="chip">Books encrypted</span></div>
  </header>

  <div class="app">
    <nav aria-label="Setup steps"><ol id="steps"></ol></nav>
    <main id="pane" aria-live="polite"></main>
  </div>
</div>

<script>
const steps=[
 {t:"Who are the books for?",h:`<h2>Who are the books for?</h2>
  <p>This picks your starting accounts and the tax form your reports map to. You can change it later.</p>
  <div class="opts">
   <label class="opt"><input type="radio" name="kind" id="k1"><b>Household</b><span>Budget and spending. No tax-form mapping.</span></label>
   <label class="opt"><input type="radio" name="kind" id="k2" checked><b>Sole proprietor or single-member LLC</b><span>Maps to Schedule C, lines 8 to 27b.</span></label>
   <label class="opt"><input type="radio" name="kind" id="k3"><b>S corporation</b><span>Maps to Form 1120-S and Schedule L.</span></label>
  </div>
  <div class="grid2">
   <label class="f">Business name<input type="text" id="bizname" placeholder="Your business name"></label>
   <label class="f">Tax year starts<select id="fy"><option>January 1</option><option>Other date</option></select></label>
  </div>`},
 {t:"Lock your books",h:`<h2>Lock your books</h2>
  <p>Your books are one encrypted file on this computer. Only this passphrase opens it. We can't recover it if you lose it, so write it down somewhere safe.</p>
  <div class="grid2">
   <label class="f">Passphrase<input type="password" id="pw" value="example-passphrase"></label>
   <label class="f">Type it again<input type="password" id="pw2" value="example-passphrase"></label>
  </div>
  <label class="f">Save the encrypted file in<input type="text" id="loc" value="Documents / TrueBalance / books.tbx"></label>
  <p class="note">Internet stays off. Integrations are off until you turn one on in Settings, and every connection then shows in the Network log.</p>`},
 {t:"Import a statement",h:`<h2>Import a statement</h2>
  <p>Add a bank or card statement (CSV or OFX). Nothing is posted yet: you review every row first.</p>
  <div class="drop">Drop a statement here, or <button class="btn" type="button">Choose file</button></div>
  <div class="tbl"><table>
   <thead><tr><th>Date</th><th>Description from statement</th><th class="num">Amount</th><th>Privacy check</th></tr></thead>
   <tbody>
    <tr><td>2026-10-02</td><td>Office supply store</td><td class="num">-84.19</td><td class="ok">Clean</td></tr>
    <tr><td>2026-10-05</td><td>Transfer to acct <span class="mask">****6721</span></td><td class="num">-500.00</td><td class="flag">Account number masked</td></tr>
    <tr><td>2026-10-09</td><td>Client payment, invoice 104</td><td class="num">2,400.00</td><td class="ok">Clean</td></tr>
    <tr><td>2026-10-14</td><td>Contractor payment, TIN <span class="mask">***-**-4410</span></td><td class="num">-1,250.00</td><td class="flag">Tax ID masked and encrypted</td></tr>
   </tbody></table></div>
  <p class="note">Statement file is read in memory and deleted after import. Masked values never reach logs or exports.</p>`},
 {t:"Review and post",h:`<h2>Review and post</h2>
  <p>Pick a category for each row. Each one posts as a balanced entry: the bank side and the category side always add to zero.</p>
  <div class="tbl"><table>
   <thead><tr><th>Date</th><th>Payee</th><th>Category</th><th>Tax line</th><th class="num">Amount</th></tr></thead>
   <tbody>
    <tr><td>10-02</td><td>Office supply store</td><td><select id="c1"><option>Office expense</option><option>Supplies</option></select></td><td>Sch C 18</td><td class="num">84.19</td></tr>
    <tr><td>10-05</td><td>Transfer</td><td><select id="c2"><option>Owner draw</option><option>Transfer between my accounts</option></select></td><td>Not deductible</td><td class="num">500.00</td></tr>
    <tr><td>10-09</td><td>Client payment</td><td><select id="c3"><option>Gross receipts</option></select></td><td>Sch C 1</td><td class="num">2,400.00</td></tr>
    <tr><td>10-14</td><td>Contractor</td><td><select id="c4"><option>Contract labor</option></select></td><td>Sch C 11 · 1099 vendor</td><td class="num">1,250.00</td></tr>
   </tbody></table></div>
  <p><span class="ok">4 of 4 entries balanced.</span> Posted entries can't be edited later; a correction adds a reversing entry, so your CPA sees the full history.</p>`},
 {t:"Reports for your CPA",h:`<h2>Reports for your CPA</h2>
  <p>Every report is built from your posted entries, so the numbers always match.</p>
  <div class="reports">
   <div class="rep"><b>Profit and loss</b><span>Income and expenses by category</span></div>
   <div class="rep"><b>Balance sheet</b><span>What you own and owe</span></div>
   <div class="rep"><b>Trial balance</b><span>Every account, debits equal credits</span></div>
   <div class="rep"><b>General ledger</b><span>Every entry with its receipt</span></div>
   <div class="rep"><b>Schedule C summary</b><span>Totals per line, 8 to 27b</span></div>
   <div class="rep"><b>1099 vendors</b><span>Yearly totals per contractor</span></div>
  </div>
  <div class="bar">
   <label class="f" style="font-weight:400"><span><input type="checkbox" id="fulltin"> Include full tax IDs in the CPA packet</span></label>
   <button class="btn primary" type="button">Build CPA packet (CSV + Excel)</button>
  </div>
  <p class="note">Tax IDs stay masked in the packet unless you tick the box. The packet is saved on this computer; you choose how to send it.</p>`}
];
let cur=0;
const ol=document.getElementById('steps'),pane=document.getElementById('pane');
function render(){
  ol.innerHTML=steps.map((s,i)=>`<li><button type="button" data-i="${i}" ${i===cur?'aria-current="step"':''}><span class="n">${i+1}</span>${s.t}</button></li>`).join('');
  pane.innerHTML=`<section style="display:grid;gap:16px">${steps[cur].h}</section>
   <div class="bar"><button class="btn" type="button" id="back" ${cur===0?'disabled':''}>Back</button>
   <button class="btn primary" type="button" id="next">${cur===steps.length-1?'Finish setup':'Continue'}</button></div>
   <div class="status"><span>Network: off (0 calls)</span><span>AI features: off</span><span>Step ${cur+1} of ${steps.length}</span></div>`;
  document.getElementById('back').onclick=()=>{if(cur>0){cur--;render();}};
  document.getElementById('next').onclick=()=>{if(cur<steps.length-1){cur++;render();}};
}
ol.addEventListener('click',e=>{const b=e.target.closest('button');if(b){cur=+b.dataset.i;render();}});
render();
</script>
